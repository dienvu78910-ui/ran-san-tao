<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bếp Trưởng Đại Chiến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="game">
    <h1>Bếp Trưởng Đại Chiến</h1>
    <div class="hud">
      <span id="hp">❤️❤️❤️❤️❤️</span>
      <span>Đợt <b id="wave">1</b></span>
      <span>Điểm <b id="score">0</b></span>
      <span id="combo"></span>
    </div>
    <div class="board">
      <canvas id="cv" width="600" height="400" aria-label="Đấu trường nhà bếp"></canvas>
      <div id="overlay" class="overlay">
        <p id="msg">Rau củ đang nổi loạn! Bảo vệ căn bếp của bạn.</p>
        <form id="saveForm" hidden>
          <input id="name" maxlength="12" placeholder="Tên của bạn" required>
          <button>Lưu điểm</button>
        </form>
        <button id="startBtn" type="button">Vào bếp</button>
      </div>
    </div>
    <div class="pad">
      <button id="atkBtn" type="button">Vung chảo</button>
      <button id="dashBtn" type="button">Lướt</button>
    </div>
    <p class="hint">WASD / mũi tên: di chuyển. Chuột trái hoặc J: vung chảo theo hướng chuột. Shift hoặc K: lướt né đòn. Điện thoại: chạm để di chuyển, dùng 2 nút.</p>
  </section>
  <aside class="rank">
    <h2>Top 5 bếp trưởng</h2>
    <ol id="list"><li>Đang tải...</li></ol>
    <p id="status" class="status"></p>
  </aside>
</main>
<script type="module" src="script.js"></script>
</body>
</html>
